name: Deploy Theme to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Theme
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Theme via SSH Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/buildlat/public_html/
            echo "CURRENT PWD: $(pwd)" > deploy-debug.txt
            echo "LISTING THEMES:" >> deploy-debug.txt
            ls -la wp-content/themes/ >> deploy-debug.txt
            cd wp-content/themes/
            rm -rf buildlatam-theme
            wget -qO theme.zip https://github.com/RodrigoAlonsoDc/buyinlatam-theme/archive/refs/heads/main.zip
            unzip -q theme.zip
            mv buyinlatam-theme-main buildlatam-theme
            rm theme.zip
            echo "Deployment completed successfully!"

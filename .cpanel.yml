---
# Despliegue del tema buyinlatam-theme con cPanel Git Version Control.
# El repo se clona en /home/buildlat/repositories/buyinlatam-theme y este
# archivo copia los archivos del tema a la carpeta que usa WordPress.
deployment:
  tasks:
    - export DEPLOYPATH=/home/buildlat/public_html/wp-content/themes/buildlatam-theme/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
